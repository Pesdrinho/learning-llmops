repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML]
        args: [--ignore-missing-imports, --no-strict-optional, --explicit-package-bases, --namespace-packages]
        exclude: ^pipelines/(api-blackbox|crawler-brapi|agents)/app/

  - repo: local
    hooks:
      - id: no-commit-to-main
        name: Don't commit to main
        entry: bash -c 'if [ "$(git branch --show-current)" = "main" ]; then echo "Cannot commit to main branch"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
