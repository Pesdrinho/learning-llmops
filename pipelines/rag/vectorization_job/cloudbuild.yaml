# Cloud Build Configuration - RAG Vectorization Job
#
# Este arquivo define como fazer build e deploy automático no GCP.
#
# Processo:
# 1. Build da imagem Docker
# 2. Push para Artifact Registry (versionamento)
# 3. Deploy no Cloud Run Job
#
# Trigger:
#   git push → Cloud Build → Docker build → Cloud Run Job deploy
#
# Uso manual:
#   gcloud builds submit --config=pipelines/rag/vectorization_job/cloudbuild.yaml .
#
# Por que usar cloudbuild.yaml?
# - Versionamento automático de imagens no Artifact Registry
# - CI/CD integrado (triggers do Cloud Build)
# - Builds reproduzíveis e auditáveis
# - Integração com outros serviços GCP (Cloud Scheduler, etc.)

substitutions:
  _IMAGE_NAME: rag-vectorization-job
  _REGION: us-central1
  _REPOSITORY: docker-images
  _SERVICE_ACCOUNT: learning-llmops@${PROJECT_ID}.iam.gserviceaccount.com

steps:
  # ========== STEP 1: BUILD ==========
  # Cria imagem Docker otimizada para produção

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:latest'
      - '-f'
      - 'pipelines/rag/vectorization_job/Dockerfile'
      - '.'

    waitFor: ['-']

  # ========== STEP 2: PUSH ==========
  # Envia imagem para Artifact Registry (registry privado do GCP)
  # Isso permite versionamento e reuso da imagem

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}'

    waitFor: ['build-image']

  # ========== STEP 3: DEPLOY ==========
  # Faz deploy no Cloud Run Job (não é um Service, é um Job executável sob demanda)

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run-job'
    entrypoint: gcloud
    args:
      # Comando base para Cloud Run Jobs
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_IMAGE_NAME}'

      # Imagem versionada do Artifact Registry
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}'

      # Localização
      - '--region=${_REGION}'

      # Recursos (jobs podem precisar de mais recursos)
      - '--memory=1Gi'          # 1GB RAM (processamento de embeddings)
      - '--cpu=1'               # 1 vCPU
      - '--task-timeout=3600'   # 1 hora (pode processar muitos documentos)

      # Retry e execução
      - '--max-retries=3'       # Tenta até 3 vezes se falhar
      - '--parallelism=1'       # Executa 1 task por vez

      # Segurança
      - '--service-account=${_SERVICE_ACCOUNT}'

      # Variáveis de ambiente
      - '--set-env-vars=APP_ENV=production,GCS_BUCKET_NAME=llmops-rag-docs'

      # Secrets (configurados no Secret Manager)
      - '--set-secrets=DB_HOST=DB_HOST:latest'
      - '--set-secrets=DB_USER=DB_USER:latest'
      - '--set-secrets=DB_PASSWORD=DB_PASSWORD:latest'
      - '--set-secrets=DB_NAME=DB_NAME:latest'
      - '--set-secrets=DB_PORT=DB_PORT:latest'
      - '--set-secrets=DATABASE_URL_SYNC=DATABASE_URL_SYNC:latest'
      - '--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest'
      - '--set-secrets=OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest'

      # Labels (para organização e billing)
      - '--labels=app=rag-vectorization,env=production,team=llmops,type=job'

    waitFor: ['push-image']

# ========== IMAGES ==========
# Lista de imagens que serão armazenadas no Artifact Registry
# Isso permite versionamento e rollback se necessário

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:latest'

# ========== OPTIONS ==========
# Configurações do build

options:
  # Máquina poderosa para build rápido
  machineType: 'N1_HIGHCPU_8'

  # Logging apenas no Cloud Logging (mais limpo)
  logging: CLOUD_LOGGING_ONLY

# ========== TIMEOUT ==========
# Timeout global do build (20 minutos)
timeout: 1200s
