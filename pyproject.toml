    "psycopg2-binary==2.9.11",
    "alembic==1.17.0",

    # LLM & AI - (Removidos temporariamente devido a conflitos de dependência)
    # "openai==2.5.0", # TODO: Re-adicionar na Fase 2 (NL2SQL/RAG) e Fase 3 (Fine-tuning)
    # "anthropic==0.71.0", # TODO: Re-adicionar na Fase 2 (NL2SQL/RAG) e Fase 3 (Fine-tuning)
    # "langchain==1.0.2", # TODO: Re-adicionar na Fase 2 (NL2SQL/RAG) e Fase 3 (Fine-tuning)
    # "langchain-openai==1.0.1", # TODO: Re-adicionar na Fase 2 (NL2SQL/RAG) e Fase 3 (Fine-tuning)
    # "langchain-community==0.3.31", # TODO: Re-adicionar na Fase 2 (NL2SQL/RAG) e Fase 3 (Fine-tuning)
    # "langgraph>=1.0.0,<1.1.0", # TODO: Re-adicionar na Fase 2 (NL2SQL/RAG)
    # "langsmith==0.4.27", # TODO: Re-adicionar na Fase 2 (Observabilidade) e Fase 4 (LangSmith Integration)

    # RAG & Embeddings - (Removidos temporariamente devido a conflitos de dependência)
    # "tiktoken==0.8.0", # TODO: Re-adicionar na Fase 2 (RAG)
    # "sentence-transformers==5.1.2", # TODO: Re-adicionar na Fase 2 (RAG)
    # "faiss-cpu==1.12.0", # TODO: Re-adicionar na Fase 2 (RAG)

    # Fine-tuning - (Removidos temporariamente devido a conflitos de dependência)
    # "transformers==4.57.1", # TODO: Re-adicionar na Fase 3 (Fine-tuning)
    # "datasets==4.2.0", # TODO: Re-adicionar na Fase 3 (Fine-tuning)
    # "peft==0.17.1", # TODO: Re-adicionar na Fase 3 (Fine-tuning)
    # "accelerate==1.11.0", # TODO: Re-adicionar na Fase 3 (Fine-tuning)
    # "bitsandbytes==0.45", # TODO: Re-adicionar na Fase 3 (Fine-tuning)
    # "trl==0.12.1", # TODO: Re-adicionar na Fase 3 (Fine-tuning)

    # Evaluation - (Removidos temporariamente devido a conflitos de dependência)
    # "ragas==0.3.7", # TODO: Re-adicionar na Fase 2 (Avaliação RAG)
    # "instructor", # TODO: Re-adicionar na Fase 2 (Avaliação RAG) - Adicionado implicitamente por ragas

    # Guardrails - (Removidos temporariamente devido a conflitos de dependência)
    # "nemoguardrails==0.11.0", # Removido temporariamente devido a conflitos de dependência com langchain

    # GCP
    "google-cloud-secret-manager==2.20.2",
    "google-cloud-storage==2.19.0",

    # Data Processing
    "httpx==0.28.1",
    "requests==2.32.5",
    "pandas==2.3.2",
    "numpy==2.3.1",

    # SQL
    "sqlglot==27.26.0",

    # Web Search
    "duckduckgo-search==8.1.1",

    # Utilities
    "python-dotenv==1.1.1",
    "pyyaml==6.0.3",
    "jinja2==3.1.6",
    "tenacity==9.1.2",
    "python-multipart==0.0.20",
    "pre-commit==4.3.0",
    "ruff==0.14.1",
