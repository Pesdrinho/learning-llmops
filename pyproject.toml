[project]
name = "learning_llmops"
version = "0.1.0"
description = "Repositório educacional completo com arquiteturas LLMOps"
authors = [
    {name = "Pedro Ribeiro Fernandes"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    # LLM & AI
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.19",
    "langgraph>=0.0.20",
    "langsmith>=0.0.83",
    # RAG & Embeddings
    "tiktoken>=0.5.2",
    "sentence-transformers>=2.3.1",
    "faiss-cpu>=1.7.4",
    # Fine-tuning
    "transformers>=4.37.0",
    "datasets>=2.16.0",
    "peft>=0.8.0",
    "accelerate>=0.26.0",
    "bitsandbytes>=0.42.0",
    "trl>=0.7.10",
    # Evaluation
    "ragas>=0.1.0",
    # Guardrails
    "nemoguardrails>=0.8.0",
    # GCP
    "google-cloud-secret-manager>=2.17.0",
    "google-cloud-storage>=2.14.0",
    # Data Processing
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "pandas>=2.1.4",
    "numpy>=1.26.3",
    # SQL
    "sqlglot>=20.11.0",
    # Web Search
    "duckduckgo-search>=4.1.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "tenacity>=8.2.3",
    "python-multipart>=0.0.6",
    "pre-commit>=4.3.0",
    "ruff>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.14",
    "pre-commit>=3.6.0",
    "ipython>=8.20.0",
    "jupyter>=1.0.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmops_lab*", "pipelines*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --cov=llmops_lab --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
