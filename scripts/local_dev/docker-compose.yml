version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: llmops-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-llmops_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-llmops_password}
      POSTGRES_DB: ${DB_NAME:-llmops}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-llmops_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmops-network

  # Redis (opcional, para cache distribuído)
  redis:
    image: redis:7-alpine
    container_name: llmops-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmops-network
    profiles:
      - full  # Só inicia com: docker compose --profile full up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  llmops-network:
    driver: bridge




